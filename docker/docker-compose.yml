services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports:
      - "5433:5432"
    volumes:
      - pulse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE: api
    environment:
      DATABASE_URL: postgresql+psycopg2://pulse:pulse@db:5432/pulse
      CHECKER_URL: http://checker:8001
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  checker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE: checker
    environment:
      DATABASE_URL: postgresql+psycopg2://pulse:pulse@db:5432/pulse
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  dashboard:
    image: nginx:alpine
    volumes:
      - ../dashboard:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE: scheduler
    environment:
      DATABASE_URL: postgresql+psycopg2://pulse:pulse@db:5432/pulse
      CHECKER_URL: http://checker:8001
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
      checker:
        condition: service_started

  # Phase 11's SLO burn-rate dashboard, provisioned from docker/grafana/dashboards/
  # at container start - http://localhost:3000 (admin/admin), no ALB/sub-path
  # config here (that's only needed once a reverse proxy is involved - see
  # terraform/README.md), so this is the simplest way to actually see the
  # dashboard render against real data before ever touching AWS.
  grafana:
    build:
      context: ..
      dockerfile: docker/grafana/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: pulse
      DB_USER: pulse
      DB_PASSWORD: pulse
      DB_SSLMODE: disable # local postgres:16-alpine has no SSL configured - RDS gets the entrypoint's own "require" default instead
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pulse-db-data:
